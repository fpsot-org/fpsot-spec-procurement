# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  official-reference: {en: The mandatory reference of a tender, fr: La référence obligatoire d’un appel d’offres}
  thresholds: {en: Thresholds of trade agreements, fr: Seuils des accords commerciaux}
  product-names: {en: Products and brands in specifications, fr: Produits et marques dans les spécifications}
  equivalence: {en: Equivalent solutions, fr: Solutions équivalentes}
  evidence: {en: Evidence of conformance, fr: Preuve de conformité}
  licensing: {en: License of the deliverables, fr: Licence des livrables}
  data-exit: {en: Data and exit, fr: Données et sortie}
  award: {en: Award criteria, fr: Critères d’adjudication}
  cost: {en: Total cost, fr: Coût total}
  results-register: {en: Public register of results, fr: Registre public des résultats}
  conflicts-of-interest: {en: Conflicts of interest, fr: Conflits d’intérêts}
rows:
  - id: PRC-002
    topic: official-reference
    requirement: {en: "Each pack states that only the normative specification is the mandatory reference of a tender.", fr: "Chaque trousse indique que seule la spécification normative est la référence obligatoire d’un appel d’offres."}
    international: {en: "The OGC guide to software acquisition warns that a tender should not cite one of its white papers as a required or mandatory technology. Buyers cite the standards themselves.", fr: "Le guide de l’OGC sur l’acquisition de logiciels prévient qu’un appel d’offres ne devrait pas citer l’un de ses livres blancs comme technologie exigée ou obligatoire. Les organisations acheteuses citent les normes elles-mêmes."}
    international_source: {title: "OGC 15-002r5, OGC Compliance Overview, Guide for Software Acquisition", version: "r5", date: "2015-04-20", url: "https://docs.ogc.org/wp/15-002r5/15-002r5.html", archive: "https://web.archive.org/web/20261028134225/https://docs.ogc.org/wp/15-002r5/15-002r5.html"}
    fpsot: {en: "Each pack and each module carries the warning, and tells the buyer to cite the specification with its version and classes.", fr: "Chaque trousse et chaque module portent cet avertissement, et demandent à l’organisation acheteuse de citer la spécification, avec sa version et ses classes."}
  - id: PRC-018
    topic: thresholds
    requirement: {en: "Each pack includes a dated table of the thresholds of the trade agreements.", fr: "Chaque trousse comprend un tableau daté des seuils des accords commerciaux."}
    international: {en: "The Agreement on Government Procurement covers a procurement only when its value reaches the threshold that each party sets in its annexes to Appendix I. The agreement text gives no figures.", fr: "L’Accord sur les marchés publics vise un marché seulement quand sa valeur atteint le seuil que chaque partie fixe dans ses annexes de l’appendice I. Le texte de l’accord ne donne aucun montant."}
    international_source: {title: "WTO, Revised Agreement on Government Procurement, Article II", version: "2012 Protocol", date: "2014-04-06", url: "https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm", archive: "https://web.archive.org/web/20261007170608/https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm"}
    fpsot: {en: "A table by kind of body and kind of contract, with its source and the date of the last check. The buyer checks the values in force on the date of its tender.", fr: "Un tableau par type d’organisme et type de contrat, avec sa source et la date de la dernière vérification. L’organisation acheteuse vérifie les valeurs en vigueur à la date de son appel d’offres."}
  - id: PRC-021
    topic: product-names
    requirement: {en: "A module never requires FPSOT software, a named implementation, a brand or a trade name.", fr: "Un module n’exige jamais de logiciel de la FPSOT, d’implémentation nommée, de marque ni de nom commercial."}
    international: {en: "Article X of the agreement bars a specification that names a trademark, a producer or a supplier, unless no other precise way to describe the need exists. Even then, the tender must add words such as or equivalent.", fr: "L’article X de l’accord interdit une spécification qui nomme une marque, un producteur ou un fournisseur, sauf s’il n’existe pas d’autre façon précise de décrire le besoin. Même alors, l’appel d’offres doit ajouter des mots comme ou l’équivalent."}
    international_source: {title: "WTO, Revised Agreement on Government Procurement, Article X, paragraph 4", version: "2012 Protocol", date: "2014-04-06", url: "https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm", archive: "https://web.archive.org/web/20261007170608/https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm"}
    fpsot: {en: "No exception: a module names a versioned specification and its classes, never a product, and states that FPSOT software is not required.", fr: "Aucune exception : un module nomme une spécification versionnée et ses classes, jamais un produit, et indique que le logiciel de la FPSOT n’est pas exigé."}
  - id: PRC-022
    topic: equivalence
    requirement: {en: "Each mention of a specification, suite or standard carries or equivalent, with a defined test of equivalence.", fr: "Chaque mention d’une spécification, d’une suite ou d’une norme porte la mention ou l’équivalent, avec un critère d’équivalence défini."}
    international: {en: "Article 42 of the directive lets buyers set specifications by performance, by reference to standards, or both. Each reference to a standard must carry the words or equivalent.", fr: "L’article 42 de la directive permet de fixer les spécifications par les performances, par renvoi à des normes, ou les deux. Chaque renvoi à une norme doit porter la mention ou équivalent."}
    international_source: {title: "Directive 2014/24/EU on public procurement, Article 42", date: "2014-02-26", url: "https://eur-lex.europa.eu/eli/dir/2014/24/oj/eng", archive: "https://web.archive.org/web/20261019220355/https://eur-lex.europa.eu/eli/dir/2014/24/oj/eng"}
    fpsot: {en: "Always or equivalent, defined as meeting the same requirements of the same version, shown by the same suite or an independent test report.", fr: "Toujours ou l’équivalent, défini comme le respect des mêmes exigences de la même version, démontré par la même suite ou par un rapport d’essai indépendant."}
  - id: PRC-024
    topic: evidence
    requirement: {en: "Each bid gives a conformance statement and the machine-readable report of the suite, or an equivalent test report.", fr: "Chaque soumission donne une déclaration de conformité et le rapport lisible par machine de la suite, ou un rapport d’essai équivalent."}
    international: {en: "Article 44 of the directive lets buyers ask for a test report or a certificate from a conformity assessment body as proof. Buyers must also accept other suitable means of proof.", fr: "L’article 44 de la directive permet d’exiger comme preuve un rapport d’essai ou un certificat d’un organisme d’évaluation de la conformité. Les organisations acheteuses doivent aussi accepter d’autres moyens de preuve appropriés."}
    international_source: {title: "Directive 2014/24/EU on public procurement, Article 44", date: "2014-02-26", url: "https://eur-lex.europa.eu/eli/dir/2014/24/oj/eng", archive: "https://web.archive.org/web/20261019220355/https://eur-lex.europa.eu/eli/dir/2014/24/oj/eng"}
    fpsot: {en: "A statement per class as a pass or fail gate, and a suite report as proof. The bidder, a third party or the buyer may run the suite, never FPSOT.", fr: "Une déclaration par classe comme condition éliminatoire, et un rapport de la suite comme preuve. L’entreprise soumissionnaire, un tiers ou l’organisation acheteuse peut exécuter la suite, jamais la FPSOT."}
  - id: PRC-030
    topic: licensing
    requirement: {en: "The license of the deliverables is a contract term: source code under a license that the OSI approves.", fr: "La licence des livrables est une condition du contrat : le code source sous une licence qu’approuve l’OSI."}
    international: {en: "The World Bank guidance says that a tender should not simply state that software must be open source. It should define the aspects of openness that it needs, such as access to source code and the rights to change and share it.", fr: "Le guide de la Banque mondiale dit qu’un appel d’offres ne devrait pas se contenter d’exiger un logiciel libre. Il devrait définir les aspects d’ouverture qu’il exige, comme l’accès au code source et le droit de le modifier et de le diffuser."}
    international_source: {title: "World Bank, Technical Procurement Guidance for DPI and Integral Digital Services, section 6.2", date: "2026-04", url: "https://documents1.worldbank.org/curated/en/099042426124014450/pdf/P513116-d415556c-ccf2-4dc8-b872-8c57596c5b6b.pdf", archive: "https://web.archive.org/web/20260924134951/https://documents1.worldbank.org/curated/en/099042426124014450/pdf/P513116-d415556c-ccf2-4dc8-b872-8c57596c5b6b.pdf"}
    fpsot: {en: "Source code of each custom deliverable under an approved license: the license of the project for a contribution, a license from the buyer's list for a new deliverable.", fr: "Le code source de chaque livrable sur mesure sous une licence approuvée : celle du projet pour une contribution, une licence de la liste de l’organisation acheteuse pour un nouveau livrable."}
  - id: PRC-034
    topic: data-exit
    requirement: {en: "The buyer owns its data, and the supplier exports it in an open format and helps the next supplier.", fr: "L’organisation acheteuse possède ses données, et le fournisseur les exporte dans un format ouvert et aide le fournisseur suivant."}
    international: {en: "The procurement chapter of the Interoperable Europe guidelines tells buyers to require data export and exit assistance. It gives no model clauses.", fr: "Le chapitre sur les marchés publics des lignes directrices d’Interoperable Europe demande d’exiger l’exportation des données et une aide à la sortie. Il ne donne aucune clause type."}
    international_source: {title: "Interoperable Europe, Guidelines on sharing and reuse of interoperability solutions, public procurement", url: "https://interoperable-europe.ec.europa.eu/collection/guidelines-sharing-interoperability-solutions/public-procurement", archive: "https://web.archive.org/web/20261012123546/https://interoperable-europe.ec.europa.eu/collection/guidelines-sharing-interoperability-solutions/public-procurement"}
    fpsot: {en: "Export at any time at no extra charge, in the model form of FPSOT data models where they apply, with a published API description and a tested exit plan.", fr: "Une exportation en tout temps sans frais supplémentaires, sous la forme des modèles de données de la FPSOT quand ils s’appliquent, avec une description publiée de l’API et un plan de sortie testé."}
  - id: PRC-038
    topic: award
    requirement: {en: "Required classes are pass or fail, and other criteria score from 0 to 5 against written anchors.", fr: "Les classes exigées sont éliminatoires, et les autres critères sont notés de 0 à 5 selon des repères écrits."}
    international: {en: "The procurement chapter of the Interoperable Europe guidelines recommends pass or fail baselines for essential needs and set scales from 0 to 5 for the rest, scoring only what goes beyond the baseline.", fr: "Le chapitre sur les marchés publics des lignes directrices d’Interoperable Europe recommande des seuils éliminatoires pour les besoins essentiels et des échelles fixes de 0 à 5 pour le reste, en notant seulement ce qui dépasse le seuil."}
    international_source: {title: "Interoperable Europe, Guidelines on sharing and reuse of interoperability solutions, public procurement", url: "https://interoperable-europe.ec.europa.eu/collection/guidelines-sharing-interoperability-solutions/public-procurement", archive: "https://web.archive.org/web/20261012123546/https://interoperable-europe.ec.europa.eu/collection/guidelines-sharing-interoperability-solutions/public-procurement"}
    fpsot: {en: "The same structure, with default weights that total 100 and no points for any tie to FPSOT.", fr: "La même structure, avec des pondérations par défaut qui totalisent 100 et aucun point pour un lien avec la FPSOT."}
  - id: PRC-039
    topic: cost
    requirement: {en: "A cost-element worksheet, filled in before the tender, quantifies license, change, interoperability and exit costs.", fr: "Un tableau des éléments de coût, rempli avant l’appel d’offres, chiffre les coûts de licence, d’évolution, d’interopérabilité et de sortie."}
    international: {en: "The World Bank guidance asks buyers to weigh life-cycle costs, including total cost of ownership and exit. It notes that open source software is not free to run.", fr: "Le guide de la Banque mondiale demande de tenir compte des coûts sur le cycle de vie, y compris le coût total de possession et la sortie. Il souligne que l’exploitation d’un logiciel libre n’est pas gratuite."}
    international_source: {title: "World Bank, Technical Procurement Guidance for DPI and Integral Digital Services", date: "2026-04", url: "https://documents1.worldbank.org/curated/en/099042426124014450/pdf/P513116-d415556c-ccf2-4dc8-b872-8c57596c5b6b.pdf", archive: "https://web.archive.org/web/20260924134951/https://documents1.worldbank.org/curated/en/099042426124014450/pdf/P513116-d415556c-ccf2-4dc8-b872-8c57596c5b6b.pdf"}
    fpsot: {en: "A worksheet with a formula per cost element, quantified before the tender, and a count of any function that needs a paid edition.", fr: "Un tableau avec une formule par élément de coût, chiffrée avant l’appel d’offres, et le compte de toute fonction qui exige une édition payante."}
  - id: PRC-044
    topic: results-register
    requirement: {en: "A public register takes conformance results through public pull requests, checked by automation.", fr: "Un registre public reçoit les résultats de conformité par des demandes de fusion publiques, vérifiées par des outils automatisés."}
    international: {en: "The Kubernetes conformance program takes each result as a pull request to a public repository. Automated checks test each submission, and then a reviewer accepts it.", fr: "Le programme de conformité de Kubernetes reçoit chaque résultat sous forme de demande de fusion dans un dépôt public. Des vérifications automatisées testent chaque soumission, puis une personne l’accepte."}
    international_source: {title: "Cloud Native Computing Foundation, Certified Kubernetes Conformance Program, instructions", url: "https://github.com/cncf/k8s-conformance/blob/master/instructions.md", archive: "https://web.archive.org/web/20261003000011/https://github.com/cncf/k8s-conformance/blob/master/instructions.md"}
    fpsot: {en: "The same model, with no certification: FPSOT merges each entry that passes the checks and judges no bid or product.", fr: "Le même modèle, sans certification : la FPSOT fusionne chaque entrée qui réussit les vérifications et ne juge aucune soumission ni aucun produit."}
  - id: PRC-051
    topic: conflicts-of-interest
    requirement: {en: "Contributors declare their commercial interests in a public register, and FPSOT never bids.", fr: "Les personnes qui contribuent déclarent leurs intérêts commerciaux dans un registre public, et la FPSOT ne soumissionne jamais."}
    international: {en: "Article X of the agreement bars a buyer from seeking or accepting advice on the specifications of a procurement from a person with a commercial interest in it, where the advice would preclude competition.", fr: "L’article X de l’accord interdit à une entité de demander ou d’accepter, pour les spécifications d’un marché, l’avis d’une personne qui y a un intérêt commercial, si cet avis empêche la concurrence."}
    international_source: {title: "WTO, Revised Agreement on Government Procurement, Article X, paragraph 5", version: "2012 Protocol", date: "2014-04-06", url: "https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm", archive: "https://web.archive.org/web/20261007170608/https://www.wto.org/english/docs_e/legal_e/rev-gpr-94_01_e.htm"}
    fpsot: {en: "A public declaration by each contributor, updated within 30 days, a no-bid rule for FPSOT and drafting help only in public.", fr: "Une déclaration publique de chaque personne qui contribue, mise à jour dans les 30 jours, une règle qui interdit à la FPSOT de soumissionner et une aide à la rédaction offerte seulement en public."}
