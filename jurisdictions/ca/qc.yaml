code: CA-QC
name: {en: Québec, fr: Québec}
rows:
  - id: PRC-018
    text: {en: "The Treasury Board secretariat publishes a table of the thresholds of each agreement, by kind of body and contract, valid from 2026-01-01. For services, the thresholds of most provincial bodies are 139,000 dollars under the internal agreements and 368,000 dollars under the agreement with the European Union.", fr: "Le Secrétariat du Conseil du trésor publie un tableau des seuils de chaque accord, par type d’organisme et de contrat, en vigueur depuis le 1er janvier 2026. Pour les services, les seuils de la plupart des organismes provinciaux sont de 139 000 $ selon les accords intérieurs et de 368 000 $ selon l’accord avec l’Union européenne."}
    status: same
    source: {title: "Secrétariat du Conseil du trésor, Accords de libéralisation des marchés publics, seuils d’application", date: "2026-01-01", url: "https://www.tresor.gouv.qc.ca/fileadmin/PDF/faire_affaire_avec_etat/cadre_normatif/accords/tab_synthese_seuils_accords.pdf", archive: "https://web.archive.org/web/20260813105943/https://www.tresor.gouv.qc.ca/fileadmin/PDF/faire_affaire_avec_etat/cadre_normatif/accords/tab_synthese_seuils_accords.pdf"}
    last_checked: "2026-11-08"
  - id: PRC-022
    text: {en: "The guide on the municipal act says that a municipal body must state its needs by performance and function. Where it cannot, it must accept equivalents, and may say how it will assess them. The guide places this duty in article 41, to be verified.", fr: "Le guide sur la loi municipale dit qu’un organisme municipal doit définir ses besoins en termes de performance et de fonctionnalité. S’il ne le peut pas, il doit accepter des équivalences, et peut dire comment il les évaluera. Le guide situe cette obligation à l’article 41, à vérifier."}
    status: looser
    source: {title: "Ministère des Affaires municipales et de l’Habitation, Guide explicatif Muni-Express, Loi sur les contrats des organismes municipaux, section 8.3.2", version: "2nd edition", date: "2026", url: "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/affaires-municipales/publications/muni_express/GUI_muni_express_lcom.pdf", archive: "https://web.archive.org/web/20260516045028/https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/affaires-municipales/publications/muni_express/GUI_muni_express_lcom.pdf"}
    last_checked: "2026-11-08"
  - id: PRC-030
    text: {en: "The contract management directive, as the free software framework quotes it, gives the body a license to custom software that is not exclusive, cannot lapse, has no limit of time or place, carries no royalty and lets other bodies use it. It does not require an open source license.", fr: "La directive sur la gestion contractuelle, telle que la cite le cadre sur les logiciels libres, donne à l’organisme une licence sur le logiciel sur mesure qui est non exclusive, irrévocable, sans limites de temps et de territoire, libre de redevances et utilisable par d’autres organismes. Elle n’exige pas de licence libre."}
    status: looser
    source: {title: "Ministère de la Cybersécurité et du Numérique, Cadre de référence des logiciels libres, section 4.4", version: "4.1", date: "2022-12", url: "https://cdn-contenu.quebec.ca/cdn-contenu/gouvernement/SCT/vitrine_numeriQc/gouvernement_ouvert/Logiciel_libre/Cadre_reference_logiciels_libres.pdf", archive: "https://web.archive.org/web/20251018193139/https://cdn-contenu.quebec.ca/cdn-contenu/gouvernement/SCT/vitrine_numeriQc/gouvernement_ouvert/Logiciel_libre/Cadre_reference_logiciels_libres.pdf"}
    last_checked: "2026-11-08"
  - id: PRC-039
    text: {en: "For a contract that includes goods, a provincial body may add to the bid prices the additional costs over the useful life of the goods, such as license, change, interoperability and data migration. The tender documents must name these elements in advance. The consolidated text places this in article 15, to be verified. Municipal bodies cannot yet do so.", fr: "Pour un contrat qui comprend une acquisition de biens, un organisme provincial peut ajouter aux prix soumis les coûts additionnels sur la durée de vie utile des biens, comme la licence, l’évolution, l’interopérabilité et la migration de données. Les documents d’appel d’offres doivent nommer ces éléments à l’avance. Le texte consolidé situe cette règle à l’article 15, à vérifier. Les organismes municipaux ne peuvent pas encore le faire."}
    status: same
    source: {title: "Règlement sur les contrats des organismes publics en matière de technologies de l’information, chapitre C-65.1, r. 5.1, consolidated text", version: "current to 2026-10-02", date: "2026-10-02", url: "https://www.publicationsduquebec.gouv.qc.ca/fileadmin/Fichiers_client/lois_et_reglements/CodificationsAdministratives/C65_1_R5_1.pdf", archive: "https://web.archive.org/web/20251013203306/https://www.publicationsduquebec.gouv.qc.ca/fileadmin/Fichiers_client/lois_et_reglements/CodificationsAdministratives/C65_1_R5_1.pdf"}
    last_checked: "2026-11-08"
  - id: PRC-051
    text: {en: "The contract policy of the Curateur public extends its conflict-of-interest rules to suppliers that help prepare a tender document. It does not bar them from bidding, and asks for no public declaration.", fr: "La politique de gestion contractuelle du Curateur public étend ses règles sur les conflits d’intérêts aux fournisseurs qui participent à l’élaboration d’un document d’appel d’offres. Elle ne leur interdit pas de soumissionner, et n’exige aucune déclaration publique."}
    status: looser
    source: {title: "Curateur public du Québec, Politique en matière de gestion contractuelle impliquant une dépense de fonds publics (ORG-120)", date: "2024-04-29", url: "https://cdn-contenu.quebec.ca/cdn-contenu/curateur-public/pdf/polit_direct_proc/organisat/ORG-120.pdf", archive: "https://web.archive.org/web/20251031043540/https://cdn-contenu.quebec.ca/cdn-contenu/curateur-public/pdf/polit_direct_proc/organisat/ORG-120.pdf"}
    last_checked: "2026-11-08"
